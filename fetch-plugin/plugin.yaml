name: fetch
label: Fetch
kind: platform
version: 0.8.0
description: "Fetch iOS app channel for Hermes. Pairs the app to this agent (link + QR), like linking WhatsApp Web — relay pairing reaches the agent through the hosted relay with no inbound port / no Tailscale. Also sends a push when a turn finishes or the agent needs attention, owns the Fetch inbox delivery target for cron/webhooks, and teaches the agent to deliver host files with standard MEDIA markers. Registers a platform_hint for generative-UI `card` fences the app renders natively (see the `fetch-cards` skill for patterns). No Apple Developer credentials live on this host."
author: Fetch
hooks:
  - post_llm_call
  - pre_approval_request
  - pre_tool_call
optional_env:
  - name: HERMES_FETCH_RELAY_URL
    description: Override the Fetch push relay base URL (defaults to the hosted relay). Point at a locally-run relay during development.
    password: false
  - name: HERMES_FETCH_ENROLLMENT_TOKEN
    description: One-time setup code from the signed-in Fetch app. Usually pasted interactively during setup.
    password: true
  - name: HERMES_FETCH_RELAY_REGISTRATION_TOKEN
    description: Operator/private relay registration token. Public Fetch users should not need this.
    password: true
  - name: HERMES_FETCH_TUNNEL_ENABLED
    description: "Set to 1/true to hold a persistent reverse-tunnel WebSocket to the relay so the app can reach this agent without Tailscale. Fetch setup enables this automatically, and paired agents auto-start the tunnel even if this flag is missing. Set to 0/false only to force-disable it."
    password: false
  - name: HERMES_FETCH_TUNNEL_DISABLE_DASHBOARD_AUTOSTART
    description: "Set to 1/true only if you manage the local Hermes dashboard/API process yourself and do not want Fetch to start a headless relay runtime."
    password: false
  - name: HERMES_FETCH_COMPUTER_TARGET
    description: "Optional loopback VNC target for Fetch computer viewing, for example tcp://127.0.0.1:5900. Non-loopback targets are rejected."
    password: false
  - name: HERMES_FETCH_COMPUTER_NAME
    description: "Optional friendly computer name shown in the Fetch viewer."
    password: false
  - name: HERMES_FETCH_COMPUTER_KIND
    description: "Optional viewer label such as Mac desktop, Windows desktop, Linux desktop, or Virtual Linux desktop."
    password: false
  - name: HERMES_FETCH_COMPUTER_VNC_PASSWORD
    description: "Dedicated loopback Screen Sharing/VNC password saved by host computer setup. Fetch uses it locally and never sends it to the relay or phone."
    password: true
  - name: HERMES_FETCH_COMPUTER_WS_URL
    description: "Legacy loopback websockify target retained for compatibility. Prefer HERMES_FETCH_COMPUTER_TARGET."
    password: false
